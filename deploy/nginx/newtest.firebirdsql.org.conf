# Test site. Static release from Hugo (current) + files from origin (assets).
# HTTPS block is added by certbot after DNS for newtest.firebirdsql.org is set.
map_hash_bucket_size 512;
map_hash_max_size 8192;
map $request_uri $fb_redirect {
    default "";
    include /srv/firebirdsql/current/_redirects.map;
}

server {
    server_name newtest.firebirdsql.org _;

    root /srv/firebirdsql/current;
    index index.html;
    charset utf-8;

    # Test site must not be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    if ($fb_redirect) { return 301 $fb_redirect; }

    # Old documentation URLs (copied as is from origin /etc/nginx/sites-available/docs_redirects.conf).
    include /etc/nginx/snippets/fb-docs-redirects.conf;

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
    sendfile on;
    open_file_cache max=500 inactive=60s;

    # Same URL works with and without trailing slash, no redirect.
    location / {
        try_files $uri $uri/index.html $uri.html @assets;
    }

    # Files copied from the origin as is (file/, img/, template/, ...).
    location @assets {
        root /srv/firebirdsql/assets;
        try_files $uri $uri/index.html =404;
        expires 7d;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|webp)$ {
        try_files $uri @assets;
        expires 7d;
    }

    location ~ /\. { deny all; }

    error_page 404 /404.html;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/newtest.firebirdsql.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/newtest.firebirdsql.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = newtest.firebirdsql.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name newtest.firebirdsql.org _;
    return 404; # managed by Certbot


}