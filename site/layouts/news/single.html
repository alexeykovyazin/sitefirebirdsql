{{ define "main" }}
{{- /* Markdown news page: same markup as the CMS news pages. */ -}}
<section class="post-layout-1-area post-layout-3-area pb-80">
<div class="container custom-container">
	<div class="row">
		<div class="col-lg-12">
			<div class="about-author-content">
				<nav aria-label="breadcrumb">
					<ol class="breadcrumb">
						<li class="breadcrumb-item"><a href="/en/start/">Home</a></li>
						<li class="breadcrumb-item"><a href="/en/about-firebird/">About Firebird</a></li>
						<li class="breadcrumb-item"><a href="/en/news/">News &amp; Events</a></li>
						<li class="breadcrumb-item active">{{ .Title }}</li>
					</ol>
				</nav>
			</div>
		</div>
		<div class="col-lg-8">
			<div class="post-layout-top-content post-layout-top-content-3">
				<div class="post-categories d-flex justify-content-between align-content-center">
					<div class="categories-share"><ul><li><i class="fas fa-calendar"></i> {{ .Date.Format "Jan 2, 2006" }}</li></ul></div>
				</div>
				<div class="post-content"><h3 class="title">{{ .Title }}</h3></div>
				<div class="post-text mt-30">
{{ .Content }}
				</div>
				<div class="post-tags">
					<ul>
						<li><a><i class="fa fa-share"></i> Share With:</a></li>
						<li style="cursor: pointer;"><a class="share-icon fb" data-url="{{ .RelPermalink }}"><i class="fab fa-facebook-f"></i></a></li>
						<li style="cursor: pointer;"><a class="share-icon lin" data-url="{{ .RelPermalink }}"><i class="fab fa-linkedin"></i></a></li>
					</ul>
				</div>
			</div>
		</div>
		<div class="col-lg-4 mt-20">
			<div class="all-post-sidebar">
				<div class="banners-wrapper mt-45"><div id="banners_PRIGHT"></div></div>
				<script type="text/javascript">$(document).ready(function(){ GetBanners ('PRIGHT',0) });</script>
			</div>
		</div>
	</div>
</div>
</section>
{{ end }}
