<header class="header-area header-style-2 header-style-4">
    <div class="header-centerbar">
        <div class="container custom-container">
            <div class="row align-items-center">
                <div class="col-lg-5 col-md-5">
                    <div class="logo">
                        <a href="/">
                            <img src="/img/site/logo-firebird-black.png" alt="">
                        </a>
                    </div>
                </div>
                <div class="col-lg-7 col-md-7">
                    <div class="header-search">
                        <form action="/en/search/" method="get" role="search">
                            <div class="input-box">
                                <input type="search" placeholder="What are you looking for?" name="q" aria-label="Search">
                                <button type="submit">Search</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="header-menubar">
        <div class="container custom-container">
            <div class="menubar-bg">
                <div class="row align-items-center">
                    <div class="col-lg-12 col-sm-3 col-3">
                        <div class="header-menu header-menu-style-2 d-flex justify-content-between align-items-center">
                            <div class="stellarnav">
                                <ul>    
                                                                            <li>
                                                                                            <a href="/en/start/" class="{{ if eq $.Params.menu_active "/en/start/" }}active{{ end }}">Home</a>
                                                                                    </li>
                                                                            <li>
                                                                                            <a href="/en/firebird-rdbms/" class="{{ if eq $.Params.menu_active "/en/firebird-rdbms/" }}active{{ end }}">Documentation</a>
                                                                                    </li>
                                                                            <li>
                                                                                            <a href="/en/server-packages/" class="{{ if eq $.Params.menu_active "/en/server-packages/" }}active{{ end }}">Downloads</a>
                                                                                    </li>
                                                                            <li>
                                                                                            <a href="/en/community/" class="{{ if eq $.Params.menu_active "/en/community/" }}active{{ end }}">Community</a>
                                                                                    </li>
                                                                            <li>
                                                                                            <a href="/en/support/" class="{{ if eq $.Params.menu_active "/en/support/" }}active{{ end }}">Support</a>
                                                                                    </li>
                                                                            <li>
                                                                                            <a href="/en/development/" class="{{ if eq $.Params.menu_active "/en/development/" }}active{{ end }}">Development</a>
                                                                                    </li>
                                                                            <li>
                                                                                            <a href="/en/certification/" class="{{ if eq $.Params.menu_active "/en/certification/" }}active{{ end }}">Certification</a>
                                                                                    </li>
                                                                            <li>
                                                                                            <a href="/en/shop/" class="{{ if eq $.Params.menu_active "/en/shop/" }}active{{ end }}">Shop</a>
                                                                                    </li>
                                    
                                </ul>
                            </div><!-- .stellarnav -->
                            <div class="header-right-section d-flex align-items-center">
                                <div class="social-links-menu">
                                    <a href="https://www.facebook.com/FirebirdSQL" target="_blank"><i class="fab fa-facebook-f"></i></a>
                                    <a href="https://www.linkedin.com/company/firebird-foundation-firebirdsql" target="_blank"><i class="fab fa-linkedin"></i></a>
                                    <a href="https://www.youtube.com/SQLFirebird" target="_blank"><i class="fab fa-youtube"></i></a>
                                </div>
                                <div class="language-select-menu nice-select-item">
                                    <select id="languageSelect">
                                                                                                                                    <option data-display="English" selected disabled>English</option>
                                                                                    
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
