baseURL = "https://firebirdsql.org/"
locale = "en"
title = "Firebird"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = false
disableHugoGeneratorInject = true
timeout = "300s"

[markup.goldmark.renderer]
  unsafe = true

[sitemap]
  changeFreq = "weekly"

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  page = ["HTML"]

[security]
  allowContent = ["text/html", "text/markdown", "text/org", "text/asciidoc", "text/rst", "text/pandoc"]

# Markdown news (site/content/news/*.md) -> /en/news/<file name>/
[permalinks]
  news = "/en/news/:contentbasename/"
